# Self-checks for deploy-workflows. Never touches AWS.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Terraform fmt + validate (module, offline)
        run: |
          set -euo pipefail
          terraform fmt -check -recursive modules
          cd modules/github-oidc-roles
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  sandbox:
    name: Terraform sandbox separation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hostile terraform can't see runner secrets (container test)
        run: bash tests/sandbox/run.sh

  # On a real GitHub-hosted runner: setup-terraform puts terraform under the runner's home, which
  # the sandbox closes; the sandbox must still resolve the pinned terraform (ICE run 40190680299).
  sandbox-hosted:
    name: Terraform sandbox on a hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Sandbox setup + terraform version as the sandbox user
        env:
          SANDBOX_TF_VERSION: "1.17.0"
        run: |
          set -euo pipefail
          printf 'sts.us-east-1.amazonaws.com\n' > "$RUNNER_TEMP/egress-hosts.txt"
          SANDBOX_EGRESS_HOSTS="$RUNNER_TEMP/egress-hosts.txt" bash scripts/tf_sandbox.sh setup "$GITHUB_WORKSPACE"
          v=$(bash scripts/tf_sandbox.sh run . version | head -n1)
          [ "$v" = "Terraform v1.17.0" ] || { echo "::error::sandbox terraform: $v"; exit 1; }
          bash scripts/tf_sandbox.sh run modules/github-oidc-roles init -backend=false -input=false -no-color | tail -n1
          bash scripts/tf_sandbox.sh egress-report
