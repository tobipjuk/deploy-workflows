# Reusable: apply an approved, saved Terraform plan with the project's deploy role.
#
# Called from the project's .github/workflows/deploy.yml (workflow_dispatch only), which Orion's
# approver GitHub App dispatches after Tobi taps Approve in Telegram (docs/orion-interface.md):
#
#   on:
#     workflow_dispatch:
#       inputs: { plan_run_id, bundle_sha256, changes_digest, allow_destroy }
#   jobs:
#     deploy:
#       uses: tobipjuk/deploy-workflows/.github/workflows/tf-apply.yml@main
#       permissions: { id-token: write, contents: read, actions: read }
#       with: { target: ..., tf_dir: ..., ... }
#
# Who may apply is decided by AWS, not by this file: the deploy role trusts only an OIDC sub of
#   repo:<o>/<r>:ref:refs/heads/main:event_name:workflow_dispatch:actor:<app-slug>[bot]
#   :run_attempt:1:job_workflow_ref:tobipjuk/deploy-workflows/.github/workflows/tf-apply.yml@refs/heads/main
# (docs/oidc-trust.md). The checks below are defence in depth and make refusals readable.
#
# The approval data (plan_run_id, bundle_sha256, changes_digest, allow_destroy) is read from the
# dispatch EVENT (github.event.inputs), never from `with:`, so an edited caller can't swap it.
name: tf-apply (reusable)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      tf_dir:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      aws_profile:
        type: string
        default: ""
      aws_account_id:
        type: string
        required: true
      deploy_role_arn:
        type: string
        required: true
      state_bucket:
        type: string
        default: ""
      terraform_version:
        type: string
        default: "1.17.0"
      approver_app_slug:
        description: Slug of Orion's approver GitHub App; the run's actor must be <slug>[bot]
        type: string
        required: true
      bundle_globs:
        description: Same globs as tf-plan's bundle_globs
        type: string
        default: ""
      invalidate:
        description: >-
          Newline-separated CloudFront invalidations after apply, each `OUTPUT` or
          `OUTPUT if ADDRESS_PREFIX` (OUTPUT = terraform output holding a distribution id;
          with `if`, only when the plan changed an address starting with ADDRESS_PREFIX).
        type: string
        default: ""
      smoke_url:
        description: URL fetched after the deploy (no credentials). Empty = no smoke check.
        type: string
        default: ""
      smoke_expect_file:
        description: Repo file the expected string is read from (e.g. app/sw.js)
        type: string
        default: ""
      smoke_pattern:
        description: Extended regex; its first match in smoke_expect_file must appear in smoke_url's body
        type: string
        default: ""
      post_deploy_script:
        description: Optional repo script run after a successful apply, in a separate job WITHOUT AWS credentials
        type: string
        default: ""

permissions: {}

jobs:
  apply:
    name: terraform apply (approved plan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tf-apply-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_DIR: ${{ inputs.tf_dir }}
      PLAN_RUN_ID: ${{ github.event.inputs.plan_run_id }}
      BUNDLE_SHA256: ${{ github.event.inputs.bundle_sha256 }}
      CHANGES_DIGEST: ${{ github.event.inputs.changes_digest }}
      ALLOW_DESTROY: ${{ github.event.inputs.allow_destroy == 'true' }}
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      # NOT A SECURITY BOUNDARY: none of the workflow-level checks below (actor, attempt, event,
      # ref, input formats) nor any `with:` input is what stops an unapproved deploy; a caller
      # or a modified run can't be trusted to keep them. The ONLY boundary is the AWS OIDC trust
      # of the deploy role: an exact StringEquals on the sub (repo, ref main, workflow_dispatch,
      # actor <app>[bot], run_attempt 1, job_workflow_ref tf-apply.yml@main). These checks exist
      # to fail early and readably, and as defence in depth.
      - name: Check the dispatch
        env:
          APP_SLUG: ${{ inputs.approver_app_slug }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          ok=true
          [[ "$APP_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::approver_app_slug is not a GitHub App slug"; ok=false; }
          [ "$ACTOR" = "${APP_SLUG}[bot]" ] || { echo "::error::Deploys are dispatched by ${APP_SLUG}[bot] only (actor: $ACTOR)."; ok=false; }
          [ "$TRIGGERING_ACTOR" = "$ACTOR" ] || { echo "::error::Triggering actor differs from actor (re-run?)."; ok=false; }
          # Fail (not skip) so Orion never reads a skipped job as a successful deploy. Re-runs
          # are also refused by the trust policy (run_attempt:1 in the sub).
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "::error::Deploys run on workflow_dispatch only."; ok=false; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Deploys run from main only."; ok=false; }
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "::error::Re-runs are not deployed: plan and approve again."; ok=false; }
          [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::plan_run_id is not a run id"; ok=false; }
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bundle_sha256 is not 64 lowercase hex"; ok=false; }
          [[ "$CHANGES_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::changes_digest is not 64 lowercase hex"; ok=false; }
          case "$TF_DIR" in /*|*..*|"") echo "::error::tf_dir must be a relative path inside the repo"; ok=false ;; esac
          $ok
          {
            echo "### Deploy request"
            echo
            echo "- Plan run: \`$PLAN_RUN_ID\`"
            echo "- Bundle sha256: \`$BUNDLE_SHA256\`"
            echo "- Changes digest: \`$CHANGES_DIGEST\`"
            echo "- Allow destroy: \`$ALLOW_DESTROY\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: deploy-workflows tools
        id: tools
        uses: tobipjuk/deploy-workflows/.github/actions/tools@main

      - name: Check the plan run (main, newest, < 2 h, exactly plan + attest jobs of tf-plan.yml)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOLS: ${{ steps.tools.outputs.dir }}
        run: |
          set -euo pipefail
          python3 -I "$TOOLS/scripts/check_plan_run.py" --repo "$GITHUB_REPOSITORY" \
            --run-id "$PLAN_RUN_ID" --expected-sha "$GITHUB_SHA" --max-age-seconds 7200 \
            --facts-out "$RUNNER_TEMP/plan-run.json"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-bundle
          path: ${{ runner.temp }}/download/bundle
          run-id: ${{ github.event.inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-summary
          path: ${{ runner.temp }}/download/summary
          run-id: ${{ github.event.inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-attestation
          path: ${{ runner.temp }}/download/attestation
          run-id: ${{ github.event.inputs.plan_run_id }}
          github-token: ${{ github.token }}

      # Guardian F1: the artifacts must be the ones attested in that run by the nested
      # tf-attest.yml job (no project code). Verifies the OIDC token (GitHub JWKS signature, no
      # redirects, iss, job_workflow_ref tf-attest.yml@main (NOT tf-plan.yml: the plan job runs
      # project Terraform),
      # repository, run_id, run_attempt, sha, iat inside the run) and that its aud commits to
      # the sha256 of the downloaded bundle and plan-summary.json; the bundle is the approved
      # one and the summary's digest is the approved digest.
      - name: Verify the plan attestation
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/download"
          facts="$RUNNER_TEMP/plan-run.json"
          attempt=$(python3 -Ic 'import json,sys; print(int(json.load(open(sys.argv[1]))["run_attempt"]))' "$facts")
          started=$(python3 -Ic 'import json,sys; print(json.load(open(sys.argv[1]))["run_started_at"])' "$facts")
          updated=$(python3 -Ic 'import json,sys; print(json.load(open(sys.argv[1]))["updated_at"])' "$facts")
          python3 -I "$TOOLS/scripts/attest.py" verify \
            --token "$d/attestation/token.jwt" --manifest "$d/attestation/manifest.json" \
            --jwks-url https://token.actions.githubusercontent.com/.well-known/jwks \
            --bundle "$d/bundle/plan-bundle.tar" --summary "$d/summary/plan-summary.json" \
            --repo "$GITHUB_REPOSITORY" --run-id "$PLAN_RUN_ID" --run-attempt "$attempt" \
            --sha "$GITHUB_SHA" --not-before "$started" --not-after "$updated" \
            --expect-bundle-sha256 "$BUNDLE_SHA256" --expect-digest "$CHANGES_DIGEST"
          echo "Plan attestation verified (tf-plan.yml@main, run $PLAN_RUN_ID attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the plan bundle and put it in place
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          GLOBS: ${{ inputs.bundle_globs }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r g; do
            g=$(printf '%s' "$g" | xargs)
            [ -z "$g" ] || args+=(--glob "$g")
          done <<< "$GLOBS"
          python3 -I "$TOOLS/scripts/bundle.py" verify --root "$GITHUB_WORKSPACE" \
            --tar "$RUNNER_TEMP/download/bundle/plan-bundle.tar" --sha256 "$BUNDLE_SHA256" \
            --source "$GITHUB_SHA" --tfplan-dest "$TF_DIR/tfplan" "${args[@]}"
          rm -rf "$RUNNER_TEMP/download"
          # Tracked files must still be exactly the commit.
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "::error::Working tree differs from $GITHUB_SHA."; exit 1; }
          echo "Plan bundle verified: \`$BUNDLE_SHA256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check setup and clean inputs
        env:
          ACCOUNT_ID: ${{ inputs.aws_account_id }}
          ROLE_ARN: ${{ inputs.deploy_role_arn }}
          TOOLS: ${{ steps.tools.outputs.dir }}
        run: |
          set -euo pipefail
          ok=true
          for v in ACCOUNT_ID ROLE_ARN; do
            [ -n "${!v}" ] || { echo "::error::Input for $v is empty (repository variable not set?)."; ok=false; }
          done
          stray=$(find . -path ./.git -prune -o \( -name '*_override.tf' -o -name 'override.tf' \
            -o -name '*_override.tf.json' -o -name 'override.tf.json' \
            -o -name '*.auto.tfvars' -o -name '*.auto.tfvars.json' -o -name '.terraformrc' \
            -o -name 'terraform.rc' \) -print)
          [ -z "$stray" ] || { echo "::error::Refusing to apply with override/auto-tfvars/CLI config files: $stray"; ok=false; }
          $ok
          python3 -I "$TOOLS/scripts/check_lockfile.py" "$TF_DIR/.terraform.lock.hcl" "$TOOLS/policy/allowed-providers.txt"

      - name: Show the OIDC subject
        run: |
          set -euo pipefail
          tok=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -Ic 'import json,sys; print(json.load(sys.stdin)["value"])')
          printf '%s' "$tok" | python3 -Ic '
          import base64, json, sys
          p = sys.stdin.read().split(".")[1]
          print("OIDC sub:", json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))["sub"])'

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.deploy_role_arn }}
          role-session-name: gh-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ inputs.aws_region }}
          # Written to ~/.aws (not env): the Terraform sandbox gets a copy of this profile only.
          aws-profile: ${{ inputs.aws_profile || 'default' }}
          allowed-account-ids: ${{ inputs.aws_account_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      # Project Terraform (and its providers) run as user tfsandbox with a scrubbed environment:
      # no OIDC request credentials, runtime token or runner files (scripts/tf_sandbox.sh). The
      # sandbox gets the verified checkout, the verified tfplan and build files, and the profile.
      - name: Set up the Terraform sandbox
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
        run: bash "$TOOLS/scripts/tf_sandbox.sh" setup "$GITHUB_WORKSPACE"

      - name: terraform init (sandbox)
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          STATE_BUCKET: ${{ inputs.state_bucket }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          args=(-input=false -lockfile=readonly)
          [ -z "$STATE_BUCKET" ] || args+=("-backend-config=bucket=${STATE_BUCKET}")
          bash "$TOOLS/scripts/tf_sandbox.sh" run "$TF_DIR" init "${args[@]}"

      # Recomputed from the plan file itself: the digest must equal the one Tobi approved,
      # and destroy / code execution / provider gates run again here.
      - name: Gates (approved digest, destroy, code execution, providers)
        id: gate
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          plan_json="$RUNNER_TEMP/plan.json"
          trap 'rm -f "$plan_json"' EXIT
          bash "$TOOLS/scripts/tf_sandbox.sh" run "$TF_DIR" show -json tfplan > "$plan_json"
          python3 -I "$TOOLS/scripts/plan_report.py" "$plan_json" \
            --summary "$GITHUB_STEP_SUMMARY" --outputs "$GITHUB_OUTPUT" \
            --addresses "$RUNNER_TEMP/changed-addresses.txt" \
            --allowed-providers "$TOOLS/policy/allowed-providers.txt" \
            --expect-digest "$CHANGES_DIGEST" --allow-destroy "$ALLOW_DESTROY"

      - name: terraform apply (saved plan, sandbox)
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          bash "$TOOLS/scripts/tf_sandbox.sh" run "$TF_DIR" apply -input=false -no-color tfplan

      - name: Invalidate CloudFront
        if: inputs.invalidate != ''
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          INVALIDATE: ${{ inputs.invalidate }}
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_PROFILE: ${{ inputs.aws_profile || 'default' }}
        run: |
          set -euo pipefail
          ids=()
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | xargs)
            [ -n "$line" ] || continue
            if [[ "$line" =~ ^([A-Za-z0-9_]+)([[:space:]]+if[[:space:]]+([A-Za-z0-9_.\"\[\]-]+))?$ ]]; then
              out=${BASH_REMATCH[1]}; prefix=${BASH_REMATCH[3]}
            else
              echo "::error::Bad invalidate line: $line"; exit 1
            fi
            if [ -n "$prefix" ] && ! grep -qF -- "$prefix" <(cut -c1-"${#prefix}" "$RUNNER_TEMP/changed-addresses.txt"); then
              echo "skip $out (no change under $prefix)"; continue
            fi
            dist=$(bash "$TOOLS/scripts/tf_sandbox.sh" run "$TF_DIR" output -raw "$out")
            [[ "$dist" =~ ^E[A-Z0-9]{5,20}$ ]] || { echo "::error::Output $out is not a distribution id"; exit 1; }
            inv=$(aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' \
              --query Invalidation.Id --output text)
            echo "$out $dist $inv"
            ids+=("$out:$dist:$inv")
          done <<< "$INVALIDATE"
          for i in "${ids[@]}"; do
            IFS=: read -r name dist inv <<< "$i"
            aws cloudfront wait invalidation-completed --distribution-id "$dist" --id "$inv"
            echo "- Invalidation $name \`$dist\` \`$inv\`: completed" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke check
        if: inputs.smoke_url != ''
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
          EXPECT_FILE: ${{ inputs.smoke_expect_file }}
          PATTERN: ${{ inputs.smoke_pattern }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_URL" =~ ^https:// ]] || { echo "::error::smoke_url must be https"; exit 1; }
          expected=""
          if [ -n "$PATTERN" ]; then
            expected=$(grep -oE -- "$PATTERN" "$EXPECT_FILE" | head -n1 || true)
            [ -n "$expected" ] || { echo "::error::No match for the smoke pattern in $EXPECT_FILE"; exit 1; }
          fi
          ok=false
          for _ in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SMOKE_URL" || true)
            if [ -n "$body" ] && { [ -z "$expected" ] || grep -qF -- "$expected" <<< "$body"; }; then ok=true; break; fi
            sleep 10
          done
          if $ok; then
            echo "- Smoke \`$SMOKE_URL\`: ok${expected:+ (\`$expected\`)}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Smoke \`$SMOKE_URL\`: FAILED${expected:+ (expected \`$expected\`)}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Smoke check failed for $SMOKE_URL"
            exit 1
          fi

      - name: Deploy result for Orion
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ADD: ${{ steps.gate.outputs.add }}
          CHANGE: ${{ steps.gate.outputs.change }}
          DESTROY: ${{ steps.gate.outputs.destroy }}
          REPLACE: ${{ steps.gate.outputs.replace }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          rm -f "$TF_DIR/tfplan"
          sudo rm -rf /home/tfsandbox/src /home/tfsandbox/.aws || true
          python3 -I - "$RUNNER_TEMP/deploy-result.json" <<'PY'
          import json, os, sys
          e = os.environ
          doc = {
              "schema": 1, "target": e["TARGET"], "repo": e["GITHUB_REPOSITORY"], "sha": e["GITHUB_SHA"],
              "deploy_run_id": int(e["GITHUB_RUN_ID"]), "plan_run_id": e["PLAN_RUN_ID"],
              "bundle_sha256": e["BUNDLE_SHA256"], "changes_digest": e["CHANGES_DIGEST"],
              "status": e["JOB_STATUS"],
              "applied": {k: e.get(k.upper()) or None for k in ("add", "change", "destroy", "replace")},
          }
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(doc, f, indent=1, sort_keys=True)
          PY
          echo "result=$JOB_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload the deploy result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-result
          path: ${{ runner.temp }}/deploy-result.json
          retention-days: 7
          if-no-files-found: ignore

  post:
    name: post-deploy (no AWS credentials)
    needs: apply
    if: inputs.post_deploy_script != '' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the project's post-deploy script
        env:
          SCRIPT: ${{ inputs.post_deploy_script }}
        run: |
          set -euo pipefail
          case "$SCRIPT" in /*|*..*) echo "::error::post_deploy_script must be a repo-relative path"; exit 1 ;; esac
          [ -f "$SCRIPT" ] || { echo "::error::$SCRIPT not found"; exit 1; }
          bash "$SCRIPT"
